    <style>
        :root { --primary: #1a365d; --secondary: #3182ce; --bg: #f7fafc; --text: #2d3748; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        h1 { text-align: center; color: var(--primary); margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px; }
        
        .tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 25px; }
        .tab-btn { padding: 8px 16px; background: #edf2f7; border: none; cursor: pointer; font-weight: bold; border-radius: 20px; transition: all 0.3s; }
        .tab-btn.active, .tab-btn:hover { background: var(--secondary); color: white; }
        
        .standings-container { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 20px; margin-bottom: 25px; border-top: 5px solid var(--primary); display: none; }
        .standings-title { margin-top: 0; margin-bottom: 15px; color: var(--primary); font-size: 1.2em; display: flex; align-items: center; gap: 8px; }
        .standings-table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.95em; }
        .standings-table th { background: #edf2f7; color: var(--primary); padding: 10px; font-weight: bold; }
        .standings-table td { padding: 10px; border-bottom: 1px solid #e2e8f0; }
        .standings-table tr:hover { background-color: #f8fafc; }
        .standings-table td.team-name { text-align: left; font-weight: bold; }
        .standings-table th.pts-col, .standings-table td.pts-col { font-weight: bold; color: #e53e3e; background: #fff5f5; }

        .match-card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 15px 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid var(--secondary); }
        .match-info { flex: 1; font-size: 0.9em; color: #718096; }
        .match-info .group-tag { background: #e2e8f0; color: var(--primary); padding: 2px 8px; border-radius: 4px; font-weight: bold; margin-bottom: 5px; display: inline-block; }
        
        .match-display { display: flex; align-items: center; justify-content: center; flex: 2; font-weight: bold; font-size: 1.1em; }
        .team { width: 35%; text-align: center; }
        .score-zone { display: flex; align-items: center; gap: 5px; margin: 0 15px; }
        .score-input { width: 45px; height: 35px; text-align: center; font-size: 1.1em; font-weight: bold; border: 2px solid #cbd5e0; border-radius: 6px; }
        
        .btn-update { background: #48bb78; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .btn-update:hover { background: #38a169; }
        
        @media (max-width: 768px) {
            .match-card { flex-direction: column; text-align: center; gap: 15px; }
            .match-display { width: 100%; }
            .standings-table { font-size: 0.85em; }
            .standings-table th, .standings-table td { padding: 6px; }
        }
    </style>

        let currentMatchesData = [];
        let selectedGroup = 'ALL';

        // Lắng nghe dữ liệu hoạt động liên tục từ database
        database.ref('matches').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                database.ref('matches').set(initialMatches);
            } else {
                currentMatchesData = data;
                renderMatches(currentMatchesData, selectedGroup);
                renderStandings(currentMatchesData, selectedGroup);
            }
        }, (error) => {
            console.error("Lỗi đồng bộ Firebase: ", error);
            document.getElementById('match-list').innerHTML = `<p style="text-align: center; color: red;">Không thể tải dữ liệu. Lỗi: ${error.message}</p>`;
        });

        function renderMatches(data, groupFilter) {
            const matchListDiv = document.getElementById('match-list');
            matchListDiv.innerHTML = '';

            data.forEach((m, index) => {
                if (!m) return;
                if (groupFilter !== 'ALL' && m.group !== groupFilter) return;

                const card = document.createElement('div');
                card.className = 'match-card';

                const dateParts = m.date.split('-');
                const displayDate = `${dateParts[2]}/${dateParts[1]}/${dateParts[0]}`;

                card.innerHTML = `
                    <div class="match-info">
                        <span class="group-tag">Trận ${m.stt} - Bảng ${m.group}</span>
                        <div>📅 ${displayDate} - ⏰ ${m.time}</div>
                    </div>
                    <div class="match-display">
                        <div class="team">${m.team1}</div>
                        <div class="score-zone">
                            <input type="number" min="0" class="score-input" id="t1-${index}" value="${m.score1 !== undefined ? m.score1 : ''}">
                            <span>-</span>
                            <input type="number" min="0" class="score-input" id="t2-${index}" value="${m.score2 !== undefined ? m.score2 : ''}">
                        </div>
                        <div class="team">${m.team2}</div>
                    </div>
                    <div>
                        <button class="btn-update" onclick="updateScore(${index})">Cập nhật</button>
                    </div>
                `;
                matchListDiv.appendChild(card);
            });

            if(matchListDiv.innerHTML === '') {
                matchListDiv.innerHTML = '<p style="text-align: center; color: #a0aec0; padding: 20px;">Không có trận đấu nào.</p>';
            }
        }

        function renderStandings(data, groupFilter) {
            const standingsContainer = document.getElementById('standings-box');
            const tbody = document.getElementById('standings-body');
            const groupNameSpan = document.getElementById('current-group-name');
            
            if (groupFilter === 'ALL' || groupFilter === 'Knockout') {
                standingsContainer.style.display = 'none';
                return;
            }

            standingsContainer.style.display = 'block';
            groupNameSpan.innerText = groupFilter;
            tbody.innerHTML = '';

            let teamsData = {};

            data.forEach(m => {
                if (!m || m.group !== groupFilter) return;

                if (!teamsData[m.team1]) teamsData[m.team1] = { name: m.team1, pld: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 };
                if (!teamsData[m.team2]) teamsData[m.team2] = { name: m.team2, pld: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 };

                if (m.score1 !== "" && m.score2 !== "" && m.score1 !== undefined && m.score2 !== undefined) {
                    const s1 = parseInt(m.score1);
                    const s2 = parseInt(m.score2);

                    teamsData[m.team1].pld += 1; teamsData[m.team2].pld += 1;
                    teamsData[m.team1].gf += s1; teamsData[m.team1].ga += s2;
                    teamsData[m.team2].gf += s2; teamsData[m.team2].ga += s1;

                    if (s1 > s2) {
                        teamsData[m.team1].w += 1; teamsData[m.team1].pts += 3; teamsData[m.team2].l += 1;
                    } else if (s1 < s2) {
                        teamsData[m.team2].w += 1; teamsData[m.team2].pts += 3; teamsData[m.team1].l += 1;
                    } else {
                        teamsData[m.team1].d += 1; teamsData[m.team1].pts += 1;
                        teamsData[m.team2].d += 1; teamsData[m.team2].pts += 1;
                    }
                }
            });

            Object.keys(teamsData).forEach(name => { teamsData[name].gd = teamsData[name].gf - teamsData[name].ga; });

            let sortedTeams = Object.values(teamsData);
            sortedTeams.sort((a, b) => (b.pts !== a.pts) ? b.pts - a.pts : (b.gd !== a.gd) ? b.gd - a.gd : b.gf - a.gf);

            sortedTeams.forEach((t, i) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${i + 1}</td>
                    <td class="team-name">${t.name}</td>
                    <td>${t.pld}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td>
                    <td>${t.gf}</td><td>${t.ga}</td><td>${t.gd > 0 ? '+' + t.gd : t.gd}</td>
                    <td class="pts-col">${t.pts}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.updateScore = function(index) {
            const s1 = document.getElementById(`t1-${index}`).value;
            const s2 = document.getElementById(`t2-${index}`).value;
            
            const score1Value = s1 === "" ? "" : parseInt(s1);
            const score2Value = s2 === "" ? "" : parseInt(s2);

            database.ref(`matches/${index}`).update({
                score1: score1Value,
                score2: score2Value
            }).then(() => {
                alert("Đã cập nhật tỷ số trận " + (index + 1) + " thành công!");
            }).catch((error) => {
                alert("Lỗi cập nhật: " + error.message);
            });
        }

        window.filterGroup = function(group, event) {
            selectedGroup = group;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderMatches(currentMatchesData, selectedGroup);
            renderStandings(currentMatchesData, selectedGroup);
        }
